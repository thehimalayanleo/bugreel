services:
  - type: web
    name: bugreel
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22.12.0
      - key: OPENCODE_GO_API_KEY
        sync: false
